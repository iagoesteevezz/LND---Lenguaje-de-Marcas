<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ej41</title>
</head>
<body>
    <script>
        
        var dia = prompt("Ingrese un día de la semana (de lunes a viernes):");
        switch (dia){
            case "lunes":
                document.write("Horario de clases para el lunes: itk, ing, lnd, pro, bae");
                break;
            case "martes":
                document.write("Horario de clases para el martes: ssf, lnd, bae");
                break;
            case "miércoles":
                document.write("Horario de clases para el miércoles: itk, ing, bae, pro");
                break;
            case "jueves":
                document.write("Horario de clases para el jueves: lnd, ssf, pro, ets");
                break;
            case "viernes":
                document.write("Horario de clases para el viernes: djk, pro, ets");
                break;
        }

    </script>
</body>
</html>
