<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ej35</title>
</head>
<body>
    <script>
        var pri = Number(prompt("dame un número"));
        var seg = Number(prompt("dame otro número"));
        var op = prompt("Quieres sumar o restar?");
        if (op == "sumar")
    {
        document.write(pri + seg);
    }
        else if (op == "restar")
    {
        document.write(pri - seg);
    }
    else
    {
        document.write("respuesta incorrecta")
    }
    </script>
</body>
</html>
