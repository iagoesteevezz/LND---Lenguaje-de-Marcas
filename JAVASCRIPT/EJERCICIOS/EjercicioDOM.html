<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejemplo Práctico: Lista de Tareas</title>
</head>
<body>

    <h1>Mi Lista de Tareas</h1>
    <input type="text" id="miInput" placeholder="Escribe una tarea">
    <button id="miBoton">Añadir</button>
    <ul id="miLista"></ul>

    <script>
        const inputTarea = document.getElementById('miInput');
        const botonAnadir = document.getElementById('miBoton');
        const lista = document.getElementById('miLista');

        botonAnadir.addEventListener('click', function() {
            const texto = inputTarea.value;

            if (texto !== "") { 
                
                const nuevaTarea = document.createElement('li');

                nuevaTarea.textContent = texto;

                nuevaTarea.addEventListener('click', function() {
                    nuevaTarea.classList.toggle('completada'); 
                });

                nuevaTarea.addEventListener('dblclick', function() {
                    nuevaTarea.remove();
                });

                lista.appendChild(nuevaTarea);

                inputTarea.value = "";
            }
        });
    </script>
</body>
</html>
