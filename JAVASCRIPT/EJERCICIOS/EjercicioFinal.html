<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ej final</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Registro de Evolución</h1>

    <div class="form">
        <label for="fecha">Fecha:</label>
        <input type="date" id="fecha">
        
        <label for="valor">Peso (kg):</label>
        <input type="number" id="valor" placeholder="Ej: 72.5" step="0.1">
        
        <button id="guardar">Guardar Registro</button>
    </div>

    <h3>Historial de Registros:</h3>
    <ul id="listaDatos"></ul>

    <h3>Gráfica de Evolución:</h3>
    <canvas id="miGrafica"></canvas>

    <script>

        const fecha = document.getElementById("fecha");
        const valor = document.getElementById("valor");
        const btn = document.getElementById("guardar");
        const lista = document.getElementById("listaDatos");
        const ctx = document.getElementById("miGrafica");

        let graficaInstancia = null; 

        let registros = JSON.parse(localStorage.getItem("historialPeso")) || [];

        function actualizarInterfaz() {
            lista.innerHTML = "";
            registros.forEach(registro => {
            const li = document.createElement("li");
            li.textContent = `Día: ${registro.fecha} -> Peso: ${registro.valor} kg`;
            lista.appendChild(li);
            });

            const etiquetasFechas = registros.map(r => r.fecha); 
            const datosPeso = registros.map(r => r.valor);       


            graficaInstancia = new Chart(ctx, {
                type: "line", 
                data: {
                labels: etiquetasFechas, 
                datasets: [{
                label: "Evolución del Peso",
                data: datosPeso,
                borderWidth: 2,
                borderColor: "blue",
                backgroundColor: "rgba(0, 0, 255, 0.1)",
                fill: true
                }]
                },
                options: {
                responsive: true
                }
            });
        }

        btn.addEventListener("click", () => {
            const fechaIntroducida = fecha.value;
            const valorIntroducido = valor.value;

            if (fechaIntroducida === "" || valorIntroducido === "") {
                alert("Por favor, rellena la fecha y el peso.");
                return;
            }

            registros.push({ 
            fecha: fechaIntroducida, 
            valor: parseFloat(valorIntroducido) 
            });

            localStorage.setItem("historialPeso", JSON.stringify(registros));

            actualizarInterfaz();

            fecha.value = "";
            valor.value = "";
        });

        actualizarInterfaz();
    </script>
</body>
</html>
