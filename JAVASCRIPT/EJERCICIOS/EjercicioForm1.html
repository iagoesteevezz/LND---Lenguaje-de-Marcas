<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio1</title>
</head>
<body>
    <h1>Lugar Secreto: FBI</h1>

    <form id="formulario-fbi">

        <label for="nombre">Nombre: </label>
        <input 
            type="text" 
            id="nombre" 
            name="nombre" 
            required pattern="^[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+$" 
            autocomplete="off">

        <br><br>

        <label for="password">Contraseña: </label>
        <input 
            type="password" 
            id="password" 
            name="password" 
            required pattern="^(?=.*[a-zA-Z])(?=.*\d)(?=.*[\W_]).{8,}$" 
            autocomplete="off">

        <br><br>

        <button type="submit">Entrar</button>
    </form>

    <script>

        const formulario = document.querySelector('#formulario-fbi');
        const inputNombre = document.querySelector('#nombre');
        const inputPassword = document.querySelector('#password');

        inputNombre.addEventListener('input', () => {
            inputNombre.setCustomValidity('');
            inputNombre.checkValidity();
        });

        inputNombre.addEventListener('invalid', () => {
            inputNombre.setCustomValidity('Por favor, escribe un nombre válido');
        });

        inputNombre.addEventListener('blur', () => {
            inputNombre.value = inputNombre.value.trim();
        });

        inputPassword.addEventListener('input', () => {
            inputPassword.setCustomValidity('');
            inputPassword.checkValidity();
        });

        inputPassword.addEventListener('invalid', () => {
            inputPassword.setCustomValidity('La contraseña debe tener mínimo 8 caracteres, e incluir al menos una letra, un número y un símbolo.');
        });

        formulario.addEventListener('submit', function (event) {
            event.preventDefault();

            let nombre = inputNombre.value;
            alert("Acceso concedido, agente " + nombre);
        });
    </script>
</body>
</html>
