<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ej39</title>
</head>
<body>
    <script>
        var cero = -1;
        var lista = [];
        while(cero != 0)
    {
        num = Number(prompt("Dame un número"));
        if (num == 0)
    {
        break;
    }
    else
    {
        lista.push(num);
        if (num %2 == 0)
    {
        document.write(num + " Es par <br>");
    }
    else
    {
        document.write(num + " Es impar <br>");
    }
    }
    }
    //impirmimos el array
    document.write(lista);
    </script>
</body>
</html>
