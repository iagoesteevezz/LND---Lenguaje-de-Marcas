<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ej repaso gráfica</title>
</head>
<body>
    <h1>Mi semana</h1>
    <form id="formu">
        Día: <input type="text" id="dias"><br><br>
        Horas: <input type="number" id="horas"><br><br>
        <input type="submit">
    </form> 
    <canvas id="grafica"></canvas>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        const formu = document.getElementById("formu");
        const horas = document.getElementById("horas");
        const dias = document.getElementById("dias");
        const grafica = document.getElementById("grafica");

        let datos = JSON.parse(localStorage.getItem("hevy1")) || [];
        let michart;

        const lienzo = new Chart(grafica, {
            type:"bar",
            data: {
                labels: datos.map(item => item.dias),
                datasets: [{
                    label:"Horas",
                    data: datos.map(item => item.horas),
                    borderWidth:2,
                    borderColor:"blue"
                }]
            }, 
            options:{
                responsive:true}
        });

        formu.addEventListener("submit", function(evento){
            evento.preventDefault();
            let nuevoObjeto = {horas: Number(horas.value), dias: dias.value};
            datos.push(nuevoObjeto);
            localStorage.setItem("hevy1", JSON.stringify(datos));
            lienzo.data.labels.push(dias.value);
            lienzo.data.datasets[0].data.push(horas.value);
            
            lienzo.updates();

            horas.value="";
            dias.value="";
        });
        
    </script>
</body>
</html>
