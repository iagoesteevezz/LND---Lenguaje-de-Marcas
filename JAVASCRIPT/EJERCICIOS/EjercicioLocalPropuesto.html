<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local 2 propuesto</title>
</head>
<body>
    <h1>Registro de películas</h1>
    
    <input type="text" id="pelicula" placeholder="Escribe una película">
    <button id="guardar">Guardar</button>
    
    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Película</th>
            </tr>
        </thead>
    <tbody id="tablaPeliculas"></tbody>
    </table>


    <script>

    const input = document.getElementById("pelicula");
    const boton = document.getElementById("guardar");
    const tabla = document.getElementById("tablaPeliculas"); 

    let peliculas = JSON.parse(localStorage.getItem("peliculas")) || [];


    function pintarTabla() {
    tabla.innerHTML = "";
    peliculas.forEach((pelicula, indice) => {
    const fila = document.createElement("tr");
    const celdaNumero = document.createElement("td");
    celdaNumero.textContent = indice + 1; // +1 porque empieza en 0
    const celdaPelicula = document.createElement("td");
    celdaPelicula.textContent = pelicula;
    fila.appendChild(celdaNumero);
    fila.appendChild(celdaPelicula);
    tabla.appendChild(fila);
    });
    }


    boton.addEventListener("click", () => {
    const nombrePelicula = input.value.trim();
    if (nombrePelicula === "") {
    alert("Escribe una película");
    return;
    }
    
    peliculas.push(nombrePelicula);
    localStorage.setItem("peliculas", JSON.stringify(peliculas));
    pintarTabla();
    input.value = "";
    });
    pintarTabla();

    </script>

</body>
</html>
