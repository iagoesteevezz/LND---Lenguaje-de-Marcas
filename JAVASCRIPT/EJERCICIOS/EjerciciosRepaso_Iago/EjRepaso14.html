<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ej 14</title>
</head>
<body>
    <form id="formu">
        Concepto: <input type="text" id="concepto" required><br><br>
        Cantidad: <input type="number" id="cant"><br><br>
        <input type="submit">
    </form>

    <table id="tabla">
        <tr>
            <th>Concepto</th>
            <th>Cantidad</th>
        </tr>
    </table>

    <p id="balance"></p>
    

    <script>
        const concepto = document.getElementById("concepto");
        const cant = document.getElementById("cant");
        const tabla = document.getElementById("tabla");
        const formu = document.getElementById("formu");
        
        let datos = JSON.parse(localStorage.getItem("elBanco")) || [];

        function mostrarTabla(){
            tabla.innerHTML = `
                <tr>
                    <th>Concepto</th>
                    <th>Cantidad</th>
                </tr>`;
                
            for(let i=0;i<datos.length;i++){
                let fila = document.createElement("tr");
                let col1 = document.createElement("td");
                let col2 = document.createElement("td");
                
                col1.textContent=datos[i].concepto;
                col2.textContent=datos[i].cant;

                fila.appendChild(col1);
                fila.appendChild(col2);

                tabla.appendChild(fila);
            }
        }

        mostrarTabla();

        formu.addEventListener("submit", function(evento){
            evento.preventDefault();

            let nuevoObjeto ={concepto: concepto.value, cant: cant.value};
            datos.push(nuevoObjeto);

            localStorage.setItem("elBanco", JSON.stringify(datos));

            mostrarTabla();
            
            concepto.value="";
            cant.value="";

        });
    </script>
</body>
</html>
