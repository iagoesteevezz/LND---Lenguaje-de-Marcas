<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>#nigga {font-size:24px;}</style>
</head>
<body>
    <p id="nigga">NIGGA</p>

    <script>
        let nigga = document.getElementById("nigga");
        nigga.addEventListener("mousedown", function(){
            nigga.style.fontSize="40px";});
        nigga.addEventListener("mouseup", function(){
            nigga.style.fontSize="24px";});
    </script>
</body>
</html>
