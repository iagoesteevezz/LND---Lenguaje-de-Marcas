<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #caja {
            background-Color: lightblue;
        }
        #cord {
                position: absolute;
            }
    </style>
</head>
<body>
    <div id="caja">
        
        <h1>EJERCICIO 2</h1><br>
        <p id="cord"></p>
    </div>

    <script>
        let caja = document.getElementById("caja");
        let cord = document.getElementById("cord");

        caja.addEventListener("mouseover", function(evento){
            cord.textContent = evento.clientX + ":"+ evento.clientY;
        });
        </script>
</body>
</html>
