<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #nigga{
            background-color:green;
        }
    </style>
</head>
<body>
    <div id="nigga">
        <p>PENE</p>
    <div>
    
    <script>
        const nigga = document.getElementById("nigga");
        let cont =0;
        nigga.addEventListener("dblclick",function(){
            if(cont==0){
            nigga.style.backgroundColor="red";
            cont++;}
            else{
                nigga.style.backgroundColor="green";
            cont--;}

        })
    </script>
</body>
</html>
