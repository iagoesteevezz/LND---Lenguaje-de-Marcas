<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ej 20</title>
</head>
<body>
   <h1>Valoracines</h1>
   
   <form id="formu">
    Usuario: <input type="text" id="usuario"><br><br>
    Puntuación: <input type="number" id="nota" min="1" max="5"><br><br>
    Comentario: <input type="text" id="comentario" minlength="5"><br><br>
    <input type="submit">
   </form>

   <p id="media"></p>
   <ul id="lista"></ul>  

   <script>
    const formu= document.getElementById("formu");
    const usuario= document.getElementById("usuario");
    const nota= document.getElementById("nota");
    const comentario= document.getElementById("comentario");
    const media= document.getElementById("media");
    const lista= document.getElementById("lista");

    let datos = JSON.parse(localStorage.getItem("valoraciones2")) || [];
    
    function mostrarLista(){
        lista.innerHTML="";
        let suma =0;
        for(let i=0;i<datos.length;i++){
            let listado = document.createElement("li");
            listado.textContent= datos[i].usuario + " : "+ datos[i].nota + " : "+ datos[i].comentario;
            lista.appendChild(listado);
            suma+= datos[i].nota;
        }
        media.textContent="Media: "+ suma/datos.length;
    }
    mostrarLista();

    formu.addEventListener("submit", function(evento){
        evento.preventDefault();
        let nuevoObjeto = {usuario: usuario.value, nota: Number(nota.value), comentario: comentario.value};
        datos.push(nuevoObjeto);
        localStorage.setItem("valoraciones2", JSON.stringify(datos));
        mostrarLista();
        usuario.value="";
        nota.value="";
        comentario.value="";
    });
   </script>
</body>
</html>
