<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ej34</title>
</head>
<body>
    <script>
        var i,j;
        var filas = Number(prompt("Introduce numero de filas"));
        var colum = Number(prompt("Introduce número de columnas"));
        var res = filas * colum;

        document.write("<table border>");
        for (i = 0; i < filas; i++) {
            document.write("<tr>");
        for (j = 0; j < colum; j++) {
            document.write("<td>");
            document.write(res);
            res --;
            document.write("</td>");
        }
        document.write("</tr>");
        }
        document.write("</table>");
    </script>
</body>
</html>
