<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ej40</title>
</head>
<body>
    <script>
        var cero = -1;
        var cant = 0;
        while(cero != 0)
    {
        num = Number(prompt("Dame un número"));
        if (num < 0)
        {
            cero = 0;
        }
        else
        {
            cant++;
        }
    }
    document.write(cant);
    </script>
</body>
</html>
